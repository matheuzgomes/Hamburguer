# Publishes the site built by Astro (the dist/ folder) to GitHub Pages.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
# ("Deploy from a branch" runs Jekyll on the source, which reads the "---" fence of
# .astro files as YAML front matter and fails.)
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (which runs third-party install scripts) can only read;
# only the deploy job may publish.
permissions:
  contents: read

# One deployment at a time; a newer run does not cancel the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      # Project Pages are served from /<repo>/: Astro needs the base path and the origin.
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Budget and safety checks on what actually ships (JS size, fonts, no inline scripts).
      - run: npm run check:dist
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
